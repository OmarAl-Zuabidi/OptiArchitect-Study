[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optiarchitect"
version = "1.0.0"
dynamic = ["version"]
description = "Bilingual (English/Arabic), verification-first toolkit for teaching operations research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Omar Ahmed Mohammed Al-Zuabidi" }]
keywords = ["operations research", "linear programming", "simplex", "transportation problem",
            "hungarian algorithm", "nonlinear optimization", "education", "arabic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Arabic",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
nlp    = ["sympy>=1.12"]                         # Part 3 (safe formulas + derivatives)
plot   = ["matplotlib>=3.7"]                     # graphical method
arabic = ["arabic-reshaper>=3.0", "python-bidi>=0.4.2"]   # Arabic text in consoles / plots
web    = ["streamlit>=1.30", "pandas>=2.0", "sympy>=1.12", "matplotlib>=3.7"]
validation = ["scipy>=1.10"]                     # validation/run_validation.py
all    = ["optiarchitect[nlp,plot,arabic,web,validation]"]

[project.urls]
Homepage = "https://github.com/OmarAl-Zuabidi/OptiArchitect-Suite"
Repository = "https://github.com/OmarAl-Zuabidi/OptiArchitect-Suite"
Issues = "https://github.com/OmarAl-Zuabidi/OptiArchitect-Suite/issues"
Changelog = "https://github.com/OmarAl-Zuabidi/OptiArchitect-Suite/blob/main/CHANGELOG.md"

[project.scripts]
optiarchitect = "optiarchitect.cli:main"
optiarchitect-web = "optiarchitect.web:main"
optiarchitect-study = "optiarchitect.web:study_main"
optiarchitect-study-admin = "optiarchitect.web:study_admin_main"

[tool.setuptools.dynamic]
version = { attr = "optiarchitect.config.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["optiarchitect*"]
